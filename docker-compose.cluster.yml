services:
  xinugate:
    image: ${XINUGATE_IMAGE:-x-inu/xinugate:latest}
    pull_policy: always
    build:
      context: .
      dockerfile: Dockerfile
      args:
        VERSION: ${VERSION:-dev}
        COMMIT: ${COMMIT:-none}
        BUILD_DATE: ${BUILD_DATE:-unknown}
    container_name: xinugate-cluster
    environment:
      HOME_JWT: ${HOME_JWT:-}
    ports:
      - "20128:20128"
    volumes:
      - ${XINUGATE_HOME_PATH:-./home}:/root/.xinugate
      - ${XINUGATE_LOG_PATH:-./logs}:/xinugate/logs
      - ${XINUGATE_PLUGIN_PATH:-./plugins}:/xinugate/plugins
    command: >
      sh -eu -c '
        if [ -z "$$HOME_JWT" ]; then
          echo "HOME_JWT is required" >&2
          exit 1
        fi

        exec ./xinugate -home-jwt "$$HOME_JWT"
      '
    restart: unless-stopped
