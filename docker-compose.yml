services:
  xinugate:
    image: ${XINUGATE_IMAGE:-x-inu/xinugate:latest}
    pull_policy: always
    build:
      context: .
      dockerfile: Dockerfile
      args:
        VERSION: ${VERSION:-dev}
        COMMIT: ${COMMIT:-none}
        BUILD_DATE: ${BUILD_DATE:-unknown}
    container_name: xinugate
    # env_file:
    #   - .env
    environment:
      DEPLOY: ${DEPLOY:-}
    ports:
      - "20128:20128"
      - "8085:8085"
      - "1455:1455"
      - "54545:54545"
      - "51121:51121"
      - "11451:11451"
    volumes:
      - ${XINUGATE_CONFIG_PATH:-./config.yaml}:/xinugate/config.yaml
      - ${XINUGATE_AUTH_PATH:-./auths}:/root/.xinugate
      - ${XINUGATE_LOG_PATH:-./logs}:/xinugate/logs
      - ${XINUGATE_PLUGIN_PATH:-./plugins}:/xinugate/plugins
    restart: unless-stopped
