services:
  xinu-proxy-api:
    image: ${XINU_PROXY_IMAGE:-x-inu/xinu-proxy-api:latest}
    pull_policy: always
    build:
      context: .
      dockerfile: Dockerfile
      args:
        VERSION: ${VERSION:-dev}
        COMMIT: ${COMMIT:-none}
        BUILD_DATE: ${BUILD_DATE:-unknown}
    container_name: xinu-proxy-api
    # env_file:
    #   - .env
    environment:
      DEPLOY: ${DEPLOY:-}
    ports:
      - "20128:20128"
      - "8085:8085"
      - "1455:1455"
      - "54545:54545"
      - "51121:51121"
      - "11451:11451"
    volumes:
      - ${XINU_PROXY_CONFIG_PATH:-./config.yaml}:/xinuproxyapi/config.yaml
      - ${XINU_PROXY_AUTH_PATH:-./auths}:/root/.xinuproxyapi
      - ${XINU_PROXY_LOG_PATH:-./logs}:/xinuproxyapi/logs
      - ${XINU_PROXY_PLUGIN_PATH:-./plugins}:/xinuproxyapi/plugins
    restart: unless-stopped
